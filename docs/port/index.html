<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>ほしみなと管制局</title>
<style>
:root{color-scheme:dark;--bg:#060d1b;--panel:#101c31;--dark:#0c162a;--line:#35536b;--ink:#e5f1f5;--muted:#9cb6c7;--mint:#75f1c9;--gold:#ffd895;--red:#ff9b93;--fuel:#9fdfff;--cargo:#fbd181;--repair:#bda9ff}
*{box-sizing:border-box;touch-action:none;scrollbar-width:thin}
html,body{height:100dvh;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:ui-monospace,monospace}
body{user-select:none}
button{appearance:none;min-width:0;background:#1b3247;border:1px solid #53758a;color:var(--ink);border-radius:3px;box-shadow:0 3px #020712;line-height:1.25;font-family:inherit;font-size:12px;font-weight:bold;padding:6px;cursor:pointer}
button:not(:disabled):active{transform:translateY(2px);box-shadow:0 1px #020712}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{cursor:default;color:#a2b0bf;background:#172538}
[hidden]{display:none!important}
#port-stars{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
#port-console{position:relative;z-index:1;height:100%;max-width:740px;margin:auto;padding:max(8px,env(safe-area-inset-top)) 9px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-rows:minmax(52px,.95fr) minmax(85px,1.6fr) minmax(104px,1.9fr) minmax(113px,1.9fr) minmax(47px,.75fr);gap:7px;opacity:1}
#port-console.paused{filter:brightness(.55)}
#port-console.training #port-store,#port-console.training .port-foot,#port-console.training #port-incoming,#port-console.training #port-control-hint,#port-console.training #port-meter,#port-console.training #port-points,#port-console.training #port-head-clock,#port-console.training #port-phase{visibility:hidden}
#port-console.training .port-head{grid-template-columns:1fr}
#port-console.training .port-pane{max-height:none}
#port-console.training .port-dock:disabled{opacity:.32}
#port-console.training .port-empty{visibility:hidden}
#port-console.training .port-ship.selected:disabled{opacity:.60}
.port-next{border:2px solid #9df4d8!important;background:#23524d!important;color:#fff!important;outline:1px dashed #a8f3d9;outline-offset:2px;box-shadow:0 0 10px #6af3cd44!important}
.port-next em,.port-next small{color:#f5ffd4!important;font-weight:bold}
.port-next:focus-visible{outline:2px solid #ffdf85;outline-offset:2px}
.port-next:disabled{opacity:1!important}
.port-onboard-order{font-size:10px;color:#86dabe;white-space:nowrap}

#port-console section,#port-console header,#port-console footer{min-width:0;border:1px solid var(--line);background:#0e1a30f3}
#port-console h2,#port-console h1,p,figure{margin:0}
.port-head{display:grid;grid-template-columns:1fr auto;align-items:center;padding:7px 9px;gap:4px}
.port-kicker{font-size:9px;letter-spacing:.19em;color:#abc6d5;white-space:nowrap}.port-head h1{font-size:clamp(13px,4vw,17px);line-height:1.2;padding-top:2px;white-space:nowrap}
#port-points{font-weight:bold;color:var(--gold);font-size:18px;text-align:right}#port-points.ping{animation:portPing .3s ease-out}@keyframes portPing{from{color:#fff3b6;text-shadow:0 0 8px #ffd380;background:#56455f}to{color:var(--gold);text-shadow:none;background:transparent}}
#port-meter{grid-column:1/3;height:5px;background:#28394d;position:relative;margin-top:1px}
#port-time-fill{width:100%;height:100%;background:var(--mint)}
#port-meter i{display:block;position:absolute;top:-2px;width:1px;height:9px;background:#abc9d6;opacity:.55}
.port-pane{padding:6px 7px;display:grid;grid-template-rows:auto 1fr;gap:5px;position:relative}
.port-pane-label{display:flex;align-items:center;justify-content:space-between;gap:5px;font-size:11px;white-space:nowrap;min-height:15px}
.port-eyebrow{font-size:9px;font-weight:bold;letter-spacing:.095em;color:#8fb1c7}
#port-incoming{color:#adc5d2;font-weight:bold;font-size:10px}
#port-rows{display:grid;grid-template-rows:repeat(3,minmax(21px,1fr));gap:4px;overflow:visible}
.port-ship{position:relative;width:100%;display:grid;grid-template-columns:minmax(18px,.08fr) minmax(40px,.32fr) minmax(65px,.38fr) minmax(33px,.22fr);gap:5px;align-items:center;text-align:left;padding:2px 5px;background:#152a40;transition:background .15s;box-shadow:none;overflow:hidden}
.port-ship b,.port-ship em,.port-ship small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.port-ship em{font-style:normal;font-size:11px}.port-ship small{font-size:10px;text-align:right;color:#b3c9d6}.port-ship b{font-size:11px}
.port-ship.selected{background:#234353;border-color:var(--mint)}
.port-ship.selected::after{content:"";border:1px dashed var(--mint);position:absolute;inset:2px;pointer-events:none}
.port-ship.risk{border-left:5px double var(--red)}.port-ship.risk small{color:#ffd3ba}
.port-ship.taking{opacity:.2;border-style:dashed}

.port-ship.risk .patience{background:var(--red)}
.port-empty{background:#0c1525;color:#8ca4b7;border:1px dashed #3b4d65;font-size:10px;padding:3px 7px}
.port-glyph{display:inline-grid;place-items:center;min-width:16px;font-size:15px;line-height:1}
.port-fuel{color:var(--fuel)}.port-cargo{color:var(--cargo)}.port-repair{color:var(--repair)}
.port-dock-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.port-dock{position:relative;display:grid;align-content:space-between;gap:3px;border:1px solid #507083;background:#182d47;color:var(--ink);text-align:left;box-shadow:none;padding:5px;overflow:visible}
.port-dock.ready{border-color:var(--mint);background:#1a433e}
.port-dock.can-drop{outline:2px dashed #78f7c9;outline-offset:-4px}
.port-dock.drop-over{background:#23534f}
.port-badge{display:flex;justify-content:space-between;font-size:10px;font-weight:bold;white-space:nowrap}
.port-dock strong{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.port-dock em{font-size:10px;color:#bbcbd3;font-style:normal;white-space:nowrap}
.port-dock .remain{position:absolute;left:2px;right:2px;bottom:2px;height:3px;background:#0b1427}
.port-dock .remain i{display:block;height:100%;background:#8bedcd}
.port-dock .dial{width:15px;height:15px;display:inline-grid;place-items:center;border-radius:50%;background:conic-gradient(#90ebcd calc(var(--a,0)*1turn),#304c68 0);color:#081626}
.port-dock .dial::after{content:"";background:#19334a;width:9px;height:9px;border-radius:50%}
#port-store{grid-template-rows:auto auto 1fr}
.port-market{display:flex;align-items:center;gap:5px;white-space:nowrap;font-size:10px}
.port-market>button{font-size:10px;padding:3px 6px;min-height:22px;box-shadow:none}
.port-market>button.active{border-color:var(--mint);color:var(--mint)}
#port-credit{margin-left:auto;color:var(--gold);font-size:12px}
#port-stock{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.port-good{overflow:visible;text-align:left;display:grid;grid-template-columns:1fr auto;align-content:space-evenly;gap:3px;border-color:#507084;padding:4px 5px;box-shadow:none}
.port-good .port-price{grid-column:1/3;white-space:nowrap;font-weight:normal;color:#eacba8;font-size:10px}
.port-good .port-price.poor{color:var(--red)}
.port-price.shake{display:inline-block;animation:portShake .28s ease-in-out}
.port-price.changed{animation:portFlip .22s ease-out}
.port-foot{padding:4px 7px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px;position:relative}
.port-hull{display:flex;align-items:center;gap:3px}
#port-hull{display:flex;gap:3px}.port-hull i{display:block;width:11px;height:7px;background:var(--red);border:1px solid #ffa8a7}
.port-hull i.gone{background:#332c43;border-color:#473c55}
.port-hull i.after{background:#ffe1ad;animation:hullFade .5s both}
#port-chain{font-size:10px;color:var(--gold);white-space:nowrap;padding-left:3px}
#port-accepts{font-size:10px;color:var(--mint);letter-spacing:.1em;margin-left:4px}#port-chain.broken{color:#ffa99b}
#port-speed{display:grid;grid-template-columns:auto repeat(3,minmax(32px,1fr));gap:4px;font-size:9px;color:var(--mint);align-items:center}#port-speed b{min-height:12px;background:linear-gradient(90deg,#315568 var(--remaining,0%),transparent var(--remaining,0%));padding-left:2px;white-space:nowrap}#port-note{font-size:10px;color:#dae5eb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
#port-hud-report{font-size:11px;padding:7px 9px;min-height:29px}
#port-fx{position:fixed;inset:0;pointer-events:none;z-index:10}
.port-fly{position:absolute;pointer-events:none;background:#fbe195;color:#243642;border:1px solid #fef1ba;box-shadow:2px 2px #182235;border-radius:2px;padding:1px 4px;font:bold 11px monospace;white-space:nowrap}
#port-wire{position:absolute;inset:0;width:100%;height:100%}
#port-glass{position:fixed;z-index:11;left:8px;right:8px;top:8px;bottom:8px;pointer-events:none}
#port-glass.warn{border:2px dashed #e38480;opacity:.6;border-radius:5px}
#port-float{position:absolute;pointer-events:none;border:1px solid #c8f6df;color:#eeffed;background:#225f61;box-shadow:4px 7px #1014299a;padding:6px;white-space:nowrap;font-weight:bold;font-size:12px}
#port-edge{position:absolute;left:16px;right:16px;bottom:64px;animation:portRise .15s both;padding:5px;color:#241628;background:#f8b890;border:1px solid #ffe6cc;text-align:center;font-weight:800;font-size:11px;transform:translateY(0);z-index:3}
#port-overlay{position:fixed;z-index:5;inset:0;display:grid;place-items:center;padding:clamp(12px,5vw,30px);background:#03071580}
.port-card{position:relative;width:min(100%,400px);padding:clamp(13px,4vw,24px);background:#101e35;border:2px solid #709cb3;border-radius:4px;box-shadow:0 8px #040a17,inset 0 0 0 3px #182c45;text-align:center}
.port-card > *+*{margin-top:8px}
.port-card strong{color:var(--mint)}
.port-card h1{font-size:clamp(22px,7vw,37px);color:#ffe7a8;line-height:1.12;margin:0}
.port-card h2{font-size:clamp(19px,6vw,26px);margin:0}
.port-card p{color:#c4d9df;font-size:12px;line-height:1.45}
.port-card button{min-height:38px}.port-card button.port-primary{color:#08252a;background:var(--mint);border-color:#aff9dd;padding:7px 19px}
.port-card .port-launch{width:100%;font-size:17px}
.port-card .port-hgroup{display:flex;gap:6px}.port-card .port-hgroup button{flex:1;min-height:30px}
#port-panel-result,#port-panel-buy{animation:portRise .24s ease-out}
#port-final-score{font-size:clamp(28px,12vw,52px);line-height:1;color:#ffdd97;font-weight:bold}
#port-final-detail{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:11px;color:#caddE8}#port-final-detail span{background:#192d49;padding:3px 4px;min-height:17px}#port-final-detail [data-enter]{animation:portRise .18s ease-out}#port-rank{min-height:22px;font-size:17px;font-weight:bold;color:var(--mint)}
#port-rank.stamp{animation:portStamp .17s ease-out}
#port-hold{position:relative;isolation:isolate;background:#194656;border-color:#8ef6d2;overflow:hidden}
#port-hold::before{content:"";position:absolute;inset:0;z-index:-1;padding:3px;background:conic-gradient(var(--mint) calc(var(--hold,0)*1turn),transparent 0);mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
#port-service-fallback{z-index:12}
#port-phase{font-size:9px;margin-left:4px;color:var(--mint)}#port-head-clock{font-size:10px;color:#bbcbd7;margin-left:6px;font-weight:bold}
#port-start-art{image-rendering:pixelated;width:min(100%,255px);height:70px;display:block;margin:4px auto 7px}
@keyframes portRise{from{opacity:0;translate:0 10px}to{opacity:1;translate:0 0}}
@keyframes portShake{25%,65%{transform:translateX(-3px)}45%,85%{transform:translateX(3px)}}
@keyframes portFlip{from{opacity:.38;transform:translateY(3px)}to{opacity:1;transform:none}}
@keyframes hullFade{to{background:#332c43;border-color:#473c55}}
@keyframes portStamp{from{opacity:.2;transform:scale(1.24)}to{opacity:1;transform:scale(1)}}
@media(min-width:600px){#port-console{padding-inline:22px}.port-pane{padding:10px 12px}.port-ship b,.port-dock strong{font-size:15px}}
@media(max-height:525px){#port-console{gap:5px;padding-block:5px;grid-template-rows:44px minmax(82px,1.35fr) minmax(91px,1.5fr) minmax(94px,1.6fr) 45px}.port-pane{padding-block:4px}.port-card{padding:12px}}
@media(max-height:460px){#port-console{gap:4px;grid-template-rows:39px minmax(73px,1.3fr) minmax(74px,1.4fr) minmax(84px,1.6fr) 39px}.port-head{padding-block:4px}.port-pane{padding-top:3px}.port-ship b,.port-ship small,.port-dock em,.port-good .port-price{font-size:9px}}
@media(prefers-reduced-motion:reduce){#port-console *,#port-overlay *{animation:none!important;transition:none!important}button:not(:disabled):active{transform:none}}
/* A shared silhouette identifies what a ship needs, across queue, dock and stock. */
.port-symbol{display:block;width:100%;height:100%;overflow:visible;pointer-events:none;flex:none}
.port-request{width:26px;height:24px;display:grid;place-items:center;justify-self:center}
.port-miniship{width:36px;height:18px;display:grid;align-items:center;color:#d4e6f5}
.port-craft{display:block;width:100%;height:auto;overflow:visible;pointer-events:none}
.port-ship{grid-template-columns:40px minmax(32px,1fr) 46px minmax(42px,58px);padding-inline:7px}
.port-ship small{text-align:right;justify-self:stretch}
.port-ship .port-request{border:1px solid currentColor;border-radius:3px;background:#0c1b2b;padding:2px}
.port-ship .port-request.has-label{width:43px;grid-template-columns:20px 1fr;font-size:8px;gap:1px;white-space:nowrap}.port-ship.selected .port-request{background:#254955;border-width:2px}
.port-dock{grid-template-rows:auto minmax(19px,1fr) auto auto;align-content:initial;gap:1px;min-height:0}
.port-badge{display:grid;grid-template-columns:16px 1fr 16px;align-items:center;color:#9fb7c9;line-height:1}.port-badge .port-status{width:15px;height:15px;justify-self:end;border:1px solid #7694a6;border-radius:50%;display:grid;place-items:center;color:#9bf1cc;font:bold 12px/1 monospace}.port-status.win{border-radius:3px;border-color:#88e4bf}.port-status.occupied{border-style:dashed}.port-status.busy{background:conic-gradient(#83e3bf calc(var(--a,0)*1turn),#26344b 0);border:1px solid #83aeab}.port-badge .port-status.blank{border-color:#7a9cb1}.port-badge .port-badge-icon{justify-self:start}.port-speedbar{height:2px;border-radius:1px;background:#466179;display:grid;align-items:center;width:100%;margin-top:2px}.port-speedbar i{height:100%;background:#a6c8df}.port-dock.matching .port-speedbar i{background:#bef4dc}
.port-badge .port-badge-icon{width:15px;height:15px;display:inline-grid;place-items:center}
.port-berth{position:relative;display:grid;place-items:center;min-height:21px;align-self:stretch;border:1px solid #415e78;border-radius:3px;background:#101f35;overflow:hidden}
.port-berth::before,.port-berth::after{content:"";position:absolute;width:7px;height:55%;top:22%;border:solid #61839b;border-width:1px 0;pointer-events:none}
.port-berth::before{left:2px;border-left-width:1px}.port-berth::after{right:2px;border-right-width:1px}
.port-socket{width:clamp(19px,8vw,34px);height:75%;max-height:36px;display:grid;place-items:center;opacity:.87}
.port-parked{width:75%;max-width:105px;height:100%;max-height:35px;display:grid;place-items:center;position:relative;color:#aaccdf}
.port-parked svg{width:min(90%,64px);max-height:100%}
.port-dock.matching .port-berth{background:#194b50;border:2px solid currentColor}
.port-dock.matching .port-socket{opacity:1}
.port-dock.matching .port-berth::before,.port-dock.matching .port-berth::after{border-color:currentColor}
.port-dock.working .port-parked{color:#8be8ca}
.port-dock .port-fill{position:absolute;inset:auto 7px 3px;height:3px;background:#29374f}
.port-dock .port-fill b{height:100%;width:var(--fuel-fill);display:block;background:currentColor}
.port-dock.working .port-berth::before{width:23%;right:auto;left:0;height:3px;top:49%;border:none;background:repeating-linear-gradient(90deg,currentColor 0 3px,transparent 3px 6px)}
.port-dock.working .port-berth::after{display:none}
.port-dock.working .port-parked::after{content:"";position:absolute;top:48%;right:47%;width:3px;height:3px;background:#ebfdf2;animation:portFeed .38s steps(4,end) infinite}
@keyframes portFeed{from{transform:translateX(-17px);opacity:.3}to{transform:translateX(0);opacity:1}}
.port-dock.ready .port-berth{background:#173c39;border-color:#6fccad}
.port-dock.ready .port-parked{color:#83f9cd;transform:translateX(10%)}
.port-dock.ready .port-berth::after,.port-dock.exit-mark .port-berth::after{content:"»";right:1px;width:auto;top:0;height:100%;display:grid;align-content:center;font:bold 20px/1 monospace;color:#b5f8c7;border:none}
.port-dock.exit-mark .port-berth{background:#174238;border-color:#9ff5be}
.port-dock.exit-mark .port-socket{opacity:.28}
.port-dock.arriving .port-parked{visibility:hidden}
.port-dock strong:empty,.port-dock em:empty{visibility:hidden}
.port-good .port-item-name{display:flex;align-items:center;gap:3px;font-size:10px;white-space:nowrap}
.port-good .port-item-name .port-symbol{width:16px;height:16px}
#port-match-lane{position:absolute;inset:0;width:100%;height:100%}
#port-float{display:flex;align-items:center;gap:4px}.port-transit{position:absolute;width:36px;height:17px;color:#e7fbef;filter:drop-shadow(1px 2px #182139);pointer-events:none}
.port-transit.departing{color:#abf9d9}
.port-transit.departing::before{content:"";display:block;position:absolute;right:95%;top:45%;width:20px;height:2px;background:linear-gradient(90deg,transparent,#bcfdce)}
#port-console #port-store{background:#0d1829d7;border-color:#28455c}
.port-good{background:#14283c;border-color:#3e5c71}.port-good.short-focus{outline:2px solid #f5b894;outline-offset:2px}.port-good.short-focus::after{content:"!";position:absolute;right:4px;top:3px;color:#ffcead}
.port-good{position:relative}.port-good.short-focus .port-price{color:#ffd1ae}
#port-console .port-foot{background:#0d1829d7}
#port-hud-report{background:#12263a;border-color:#456171}
#port-console.traffic-paused .port-dock.working .port-parked::after{animation-play-state:paused}
@media(max-height:500px){.port-dock{grid-template-rows:auto minmax(15px,1fr) auto auto}.port-dock .port-berth{min-height:16px}}
@media(prefers-reduced-motion:reduce){.port-dock.ready .port-parked{transform:none}.port-dock.working .port-parked::after{animation:none!important}}
</style></head><body>
<canvas id="port-stars" aria-hidden="true"></canvas>
<main id="port-console" hidden>
<header class="port-head"><div><div class="port-kicker">STAR HARBOR <span id="port-head-clock">70 s</span><span id="port-phase" aria-label="進行区間">Ⅰ</span></div><h1>ほしみなと管制局</h1></div><output id="port-points" aria-label="得点">0</output><div id="port-meter" aria-label="残り時間"><div id="port-time-fill"></div><i style="left:33%"></i><i style="left:66%"></i></div></header>
<section class="port-pane" aria-labelledby="queue-heading"><div class="port-pane-label"><strong id="queue-heading">到着便</strong><span id="port-learn-step" class="port-onboard-order" hidden></span><span id="port-incoming"></span></div><div id="port-rows"></div></section>
<section class="port-pane" aria-labelledby="dock-heading"><div class="port-pane-label"><strong id="dock-heading">ドック</strong><span id="port-control-hint" class="port-eyebrow">船 → ドック</span></div><div id="port-docks" class="port-dock-grid"></div></section>
<section id="port-store" class="port-pane" aria-labelledby="stock-heading"><div class="port-pane-label"><strong id="stock-heading">補給倉</strong><span id="port-credit"></span></div><div class="port-market" aria-label="仕入れ先"><button class="active" data-vendor="0" aria-pressed="true">港の商店</button><button data-vendor="1" aria-pressed="false">工房</button></div><div id="port-stock"></div></section>
<footer class="port-foot"><div><div class="port-hull" aria-label="残り見逃し許容数"><span id="port-hull"></span><span id="port-chain"></span><span id="port-accepts"></span></div><div id="port-speed" hidden><span>急速</span><b data-priority="0"></b><b data-priority="1"></b><b data-priority="2"></b></div><div id="port-note" aria-live="polite"></div></div><button id="port-hud-report">航海手帳</button></footer>
<aside id="port-edge" hidden></aside>
</main>
<div id="port-fx" aria-hidden="true"><svg id="port-match-lane" hidden><path id="port-match-line" stroke="#a5f8d7" fill="none" stroke-width="2" stroke-linecap="round"/></svg><svg id="port-wire" hidden><line id="port-line" stroke="#9ff5cb" stroke-width="2" stroke-dasharray="5 5"/></svg><div id="port-float" hidden></div></div><div id="port-glass" aria-hidden="true"></div>

<script>
(() => {
'use strict';
const root=document.querySelector('#ps-service'), q=s=>root.querySelector(s), qa=s=>[...root.querySelectorAll(s)];
const card=q('#ps-card'), list=q('.ps-list'), marker=q('#ps-marker');
const buttons=qa('.ps-list button'), tabs=qa('.ps-tabs button'), reduced=matchMedia('(prefers-reduced-motion:reduce)');
const info={fuel:['給油','燃料','fuel'],cargo:['荷役','荷物','cargo'],repair:['修理','部品','parts']};
let ship,state,commit,onClose,focusBack,choice=0,locked=false,afterTimer=0,token=0,lastErr='',shown=false;
function berthText(){return 'D'+(1+Number(ship.berth||0))}
function available(){return Math.max(0,Number(state[info[ship.request][2]])||0)}
function resolveRates(){
 const sec=ship.berth===1?4.2:6.1;
 return state.rates||{standard:{score:100,seconds:sec,cost:1},priority:{score:150,seconds:sec*.55,cost:2}};
}
function plan(){return choice?'priority':'standard'}
function amount(){return resolveRates()[plan()].cost}
function sec(n){return Number(n).toFixed(1)+'秒'}
function restart(el,cl){el.classList.remove(cl);void el.offsetWidth;el.classList.add(cl)}
function keepVisible(wrap=false){
 const b=buttons[choice];if(!b.offsetHeight)return;
 const top=b.offsetTop,bottom=top+b.offsetHeight;
 if(top<list.scrollTop+2||bottom>list.scrollTop+list.clientHeight-2)list.scrollTo({top:Math.max(0,top-2),behavior:reduced.matches?'auto':'smooth'});
 if(wrap&&!reduced.matches){
  const serial=++token;marker.classList.add('loop');
  setTimeout(()=>{if(serial!==token)return;marker.style.transition='none';marker.style.transform='translateY('+(top+12)+'px)';void marker.offsetWidth;marker.style.transition=''},57);
  setTimeout(()=>{if(serial===token)marker.classList.remove('loop')},195);return;
 }
 token++;marker.classList.remove('loop');marker.style.transform='translateY('+(top+12)+'px)';
}
function renderStock(n,need,isNew){
 const shortage=Math.max(0,need-n),res=info[ship.request][1],slots=q('#ps-slots');
 slots.replaceChildren();
 const count=Math.min(8,Math.max(n,need));
 for(let i=0;i<count;i++){
  const dot=document.createElement('i');
  if(i>=n)dot.className='empty';else if(isNew&&i<need)dot.className='spent';
  slots.append(dot);
 }
 q('#ps-short').textContent=lastErr||(shortage&&!isNew?res+'があと'+shortage+'個必要':'');
 q('#ps-route').classList.toggle('cut',!!shortage&&!isNew);
 q('#ps-lacksource').textContent=res+'庫';q('#ps-dockpath').textContent=berthText();
 q('#ps-stock-summary').textContent=res+'：'+n+'個　割当：'+need+'個';
}
function render(){
 if(!ship||locked)return;
 const [job,resource]=info[ship.request], rates=resolveRates(),need=amount(),n=available();
 root.dataset.tier=String(need);
 q('#ps-kicker').textContent=berthText()+' / '+job;q('#ps-title').textContent=ship.name;
 const mark=q('#ps-resource-glyph');
 if(mark.dataset.kind!==ship.request&&window.portVisualSymbol){mark.dataset.kind=ship.request;mark.className='port-'+ship.request;mark.innerHTML=window.portVisualSymbol(ship.request)}
 q('#ps-range').value=String(need);q('#ps-units').value=String(need);
 buttons.forEach((b,i)=>b.setAttribute('aria-current',String(i===choice)));
 const stats=(k)=>{const x=rates[k];return '<b>'+(k==='priority'?'優先':'通常')+'</b><dl><dt>'+resource+'</dt><dd>'+x.cost+'個</dd><dt>作業時間</dt><dd>'+sec(x.seconds)+'</dd><dt>基本点</dt><dd>'+x.score+'</dd></dl>'};
 qa('#ps-compare>[data-choice]').forEach(el=>{
  const k=el.dataset.choice;
  const html=stats(k);if(el.innerHTML!==html)el.innerHTML=html;
  el.setAttribute('aria-current',String(plan()===k));
  el.hidden=k==='priority'&&!choice;
 });
 const {standard:a,priority:b}=rates;
 q('#ps-delta').innerHTML=choice?'基本点 <s>'+a.score+'</s> → '+b.score+'　|　空き時間 '+sec(Math.max(0,a.seconds-b.seconds))+'早い':'';
 q('#ps-pending').textContent='保留：'+resource+' '+need+'個';
 renderStock(n,need,false);
 q('#ps-commit').disabled=n<need;
 const restock=q('#ps-needstock'),short=n<need&&typeof state.restock==='function';
 restock.hidden=!short;q('#ps-commit').hidden=short;if(short)restock.textContent=resource+' あと'+(need-n)+'個 ▸';
}
function select(i,wrap=false){
 const prev=choice;choice=i;lastErr='';render();keepVisible(wrap);
 if(prev!==i&&i===1)restart(q('#ps-compare [data-choice=standard]'),'enter');
}
buttons.forEach((b,i)=>{
 b.onclick=()=>select(i);
 b.onfocus=()=>{if(!locked&&i!==choice)select(i)};
 b.onkeydown=e=>{
  if(!['ArrowUp','ArrowDown','Home','End'].includes(e.key))return;
  e.preventDefault();
  const target=e.key==='Home'?0:e.key==='End'?1:1-choice;
  const wrap=(e.key==='ArrowUp'&&choice===0)||(e.key==='ArrowDown'&&choice===1);
  if(!locked){select(target,wrap);buttons[target].focus({preventScroll:true})}
 };
});
q('#ps-range').oninput=e=>select(+e.target.value-1);
function setTab(name,moveFocus=false){
 root.dataset.tab=name;const isJob=name==='job';
 q('#ps-work').hidden=!isJob;q('#ps-stock').hidden=isJob;
 tabs.forEach(b=>{const current=b.dataset.tab===name;b.setAttribute('aria-selected',String(current));b.tabIndex=current?0:-1;if(current&&moveFocus)b.focus()});
 if(isJob)keepVisible();
 else if(q('#ps-route').classList.contains('cut')){q('#ps-route').classList.remove('cut');void q('#ps-route').offsetWidth;q('#ps-route').classList.add('cut')}
}
tabs.forEach(b=>{b.onclick=()=>setTab(b.dataset.tab);b.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();setTab(e.key==='Home'?'job':e.key==='End'?'stores':b.dataset.tab==='job'?'stores':'job',true)}});
function dismiss(){
 clearTimeout(afterTimer);afterTimer=0;token++;root.hidden=true;shown=false;
}
function close(){if(!shown)return;const done=onClose;dismiss();if(done)done();if(focusBack?.isConnected&&!focusBack.disabled)focusBack.focus({preventScroll:true})}
q('#ps-x').onclick=q('#ps-cancel').onclick=close;
q('#ps-needstock').onclick=()=>state?.restock?.();
q('#ps-commit').onclick=()=>{
 if(locked||!ship||q('#ps-commit').disabled)return;
 const before=available(),need=amount();
 const result=commit({kind:plan()});
 if(!result?.ok){lastErr=result?.reason||'作業を開始できませんでした';render();return}
 if(!shown)return;
 locked=true;
 q('#ps-tray').classList.add('confirmed');q('#ps-check').hidden=false;
 q('#ps-pending').textContent='割当確定：'+info[ship.request][1]+' '+need+'個';renderStock(before,need,true);
 q('#ps-commit').textContent='作業開始 ✓';q('#ps-commit').disabled=true;
 q('#ps-range').disabled=true;buttons.forEach(b=>b.disabled=true);
 afterTimer=setTimeout(close,reduced.matches?280:420);
};
root.addEventListener('keydown',e=>{
 e.stopPropagation();
 if(e.key==='Escape'){e.preventDefault();close();return}
 if(e.key!=='Tab')return;
 const nav=qa('button,input').filter(el=>!el.disabled&&el.tabIndex>=0&&el.getClientRects().length);
 if(e.shiftKey&&document.activeElement===nav[0]){e.preventDefault();nav.at(-1).focus()}
 if(!e.shiftKey&&document.activeElement===nav.at(-1)){e.preventDefault();nav[0].focus()}
});
function open(nextShip,nextState,action,closed){
 if(!nextShip||!info[nextShip.request]||!nextState||typeof action!=='function')return;
 dismiss();focusBack=document.activeElement;ship=nextShip;state=nextState;commit=action;onClose=closed;
 choice=0;locked=false;lastErr='';shown=true;root.hidden=false;
 q('#ps-range').disabled=false;buttons.forEach(b=>b.disabled=false);
 q('#ps-tray').classList.remove('confirmed');q('#ps-check').hidden=true;q('#ps-commit').textContent='作業開始';list.scrollTop=0;card.scrollTop=0;
 setTab('job');render();keepVisible();tabs[0].focus({preventScroll:true});
}
function update(nextState){if(!shown||!nextState)return;state=nextState;render()}
window.portService={open,update,dismiss};
})();
</script>

<section id="srView" hidden aria-label="管制ログ" role="dialog" aria-modal="true">
<div class="sr-shell"><header class="sr-head"><h2>管制ログ</h2><button type="button" data-sr="exit" aria-label="閉じる">×</button></header>
<div class="sr-tabs"><button type="button" data-sr="route" aria-pressed="true">進捗</button><button type="button" data-sr="record" aria-pressed="false">シフト記録</button></div>
<div class="sr-content"></div></div>
</section>
<script>
(()=>{
 'use strict';
 const view=document.getElementById('srView'), content=view.querySelector('.sr-content');
 const buttons=[...view.querySelectorAll('.sr-tabs button')], reduced=matchMedia('(prefers-reduced-motion: reduce)');
 const n=v=>Number.isFinite(Number(v))?Math.max(0,Number(v)):0;
 const num=v=>Math.floor(n(v)).toLocaleString('ja-JP');
 const hasNow=d=>n(d.sec)>0||n(d.served)>0||((d.frames||[]).length>1);
 const starCount=score=>[100,250,500].filter(t=>n(score)>=t).length;
 const route=[
  {name:'管制はじめ',art:'✦',rule:'出港を1隻見送る',yes:r=>n(r.served)>=1,value:r=>num(r.served)+' / 1',note:'Aバースは給油、Bは荷役、Cは修理が速い。'},
  {name:'港はにぎやか',art:'✧',rule:'1シフトで3隻出港',yes:r=>n(r.served)>=3,value:r=>num(r.served)+' / 3',note:'見送りが済むとバースが空く。待ち時間が短い船から確認。'},
  {name:'今日も定時',art:'⬡',rule:'シフトを完了する',yes:r=>!!r.clear,value:r=>r.clear?'済':'未',note:'燃料や部品は補充できる。空き時間に在庫を確認。'}
 ];
 let state={}, tab='route', page=0, currentRoute=-1, closeFn, handle=0, origin=null;
 let starSeen=0, routeReached=1;
 const opened=new Set(), ledgerSeen=new Set(), ruleSeen=new Set();
 let runIds=new WeakMap(), nextId=0;
 const recordId=r=>{if(r===state)return 'current'; if(!runIds.has(r))runIds.set(r,++nextId);return 'r'+runIds.get(r);};
 const runList=()=>[...(hasNow(state)?[state]:[]),...(state.runs||[]).filter(r=>r&&typeof r==='object')];
 const allScores=()=>Math.max(n(state.best),n(state.score),...runList().map(r=>n(r.score)));
 function stats(){const out={served:n(state.served),clear:!!state.clear}; for(const r of runList()){out.served=Math.max(out.served,n(r.served));out.clear||=!!r.clear;}return out;}
 function tabStyle(){for(const b of buttons)b.setAttribute('aria-pressed',String(b.dataset.sr===tab));}
 function row(i,done){const item=route[i];return '<button class="sr-row" type="button" data-sr="detail" data-i="'+i+'"><span>'+item.name+'</span><strong>'+(done?'✓':'›')+'</strong></button>';}
 function renderRoute(){
  const progress=stats(), next=route.map(r=>r.yes(progress));
  let first=next.findIndex(x=>!x);first=first<0?3:first;const endpoint=Math.min(3,first+1);
  const stars=starCount(allScores());
  content.innerHTML='<div class="sr-flex"><div class="sr-sub">最高 '+num(allScores())+'</div><div class="sr-stars" aria-label="星 '+stars+' / 3">'+Array.from({length:3},(_,i)=>'<i aria-hidden="true" style="--slot:'+i+'" class="'+(i<starSeen?'sr-earned':i<stars?'sr-slot sr-fresh':'sr-slot')+'"></i>').join('')+'</div></div>'+
  '<div class="sr-map" aria-label="進捗 '+next.filter(Boolean).length+' / 3"><div class="sr-mapline"><div class="sr-mapfill" style="width:'+(routeReached*100/3)+'%"></div></div>'+Array.from({length:4},(_,i)=>'<span aria-hidden="true" class="sr-dot" data-on="'+Number(i<=first)+'" style="left:'+(9+i*82/3)+'%"></span>').join('')+'</div>'+
  '<div class="sr-sub">目標</div><div data-zone="todo">'+route.map((r,i)=>row(i,next[i]&&opened.has('m'+i))).filter((_,i)=>!next[i]||!opened.has('m'+i)).join('')+'</div><div class="sr-sub">達成</div><div data-zone="done">'+route.map((r,i)=>row(i,true)).filter((_,i)=>next[i]&&opened.has('m'+i)).join('')+'</div>';
  const fill=content.querySelector('.sr-mapfill'); fill.getBoundingClientRect(); fill.style.width=(endpoint*100/3)+'%';
  routeReached=endpoint; starSeen=Math.max(starSeen,stars);
  const target=content.querySelector('[data-zone=done]');
  const moved=[];
  for(let i=0;i<route.length;i++){
   const el=content.querySelector('[data-zone=todo] [data-i="'+i+'"]');
   if(el&&next[i])moved.push({el,i,rect:el.getBoundingClientRect()});
  }
  for(const {el,i} of moved){opened.add('m'+i);el.querySelector('strong').textContent='✓';target.appendChild(el);}
  if(!reduced.matches) for(const {el,rect} of moved){
   const y=rect.top-el.getBoundingClientRect().top;
   if(y)el.animate([{transform:'translateY('+y+'px)',zIndex:1,position:'relative'},{transform:'none'}],{delay:100,fill:'both',duration:420,easing:'cubic-bezier(.19,.8,.28,1)'});
  }
  if(!target.children.length)target.innerHTML='<p class="sr-empty">まだありません</p>';
  const todo=content.querySelector('[data-zone=todo]');
  if(!todo.children.length)todo.innerHTML='<p class="sr-empty">すべて達成</p>';
 }
 function renderDetail(i,rect){
  const r=route[i], p=stats(), done=r.yes(p), fresh=done&&!ruleSeen.has(i);
  currentRoute=i;
  content.innerHTML='<article class="sr-card"><div class="sr-cardhead"><span>'+r.name+'</span><span class="sr-lock '+(done&&!fresh?'sr-unlocked':'')+'">'+(done&&!fresh?'✓ 登録済':'◇ 未登録')+'</span></div><span class="sr-rule '+(done?'sr-met':'')+'"><span>'+r.rule+'</span> <b>'+r.value(p)+'</b></span><div class="sr-fog '+(done&&!fresh?'sr-seen':'')+'" aria-label="'+(done?'認定印':'未発見の認定印')+'"><span aria-hidden="true">'+r.art+'</span></div><button type="button" data-sr="note" aria-expanded="false">管制メモ ＋</button><div class="sr-noteBox"><p class="sr-display sr-note" hidden>'+r.note+'</p></div></article><button type="button" class="sr-back" data-sr="back">‹ 進捗へ</button>';
  const card=content.querySelector('.sr-card');
  if(rect&&!reduced.matches){
   const box=card.getBoundingClientRect();
   const ghost=document.createElement('div');
   ghost.textContent=r.name;ghost.setAttribute('aria-hidden','true');
   Object.assign(ghost.style,{position:'fixed',pointerEvents:'none',zIndex:'12',background:'#182847',border:'1px solid #567ca8',padding:'10px',fontSize:'14px',fontWeight:'bold',color:'#fff0bf',overflow:'hidden',whiteSpace:'nowrap'});
   view.appendChild(ghost);
   const geometry=el=>({left:el.left+'px',top:el.top+'px',width:el.width+'px',height:el.height+'px'});
   ghost.animate([geometry(rect),{...geometry(box),opacity:1,offset:.78},{...geometry(box),opacity:0}],{duration:300,easing:'cubic-bezier(.2,.8,.25,1)',fill:'both'}).finished.then(()=>ghost.remove(),()=>ghost.remove());
   card.animate([{opacity:0},{opacity:0,offset:.74},{opacity:1}],{duration:300,fill:'both'});
  }
  if(fresh){
   const apply=()=>{
    if(!view.hidden&&currentRoute===i&&content.contains(card)){
     const rule=card.querySelector('.sr-rule');rule.classList.add('sr-tick');rule.insertAdjacentHTML('afterbegin','✓ ');card.querySelector('.sr-lock').classList.add('sr-beam');
    }
   };
   const unlock=()=>{
    if(!view.hidden&&currentRoute===i&&content.contains(card)){
     ruleSeen.add(i);
     const lock=card.querySelector('.sr-lock');lock.textContent='✓ 登録済';lock.classList.add('sr-unlocked');
     card.querySelector('.sr-fog').classList.add('sr-clear');
    }
   };
   if(reduced.matches){apply();unlock();}else{setTimeout(apply,170);setTimeout(unlock,600);}
  }
  content.querySelector('[data-sr=back]').focus({preventScroll:true});
 }
 function frameTip(input,frames,events,tip){
  const idx=Number(input.value), f=frames[idx];
  if(!f)return;
  const max=Math.max(1,n(frames.at(-1)?.score),...frames.map(x=>n(x.score)));
  const w=input.clientWidth||255;tip.style.left=Math.max(54,Math.min(w-54,w*(idx/Math.max(1,frames.length-1))))+'px';
  const point=(v,i)=>[3+i*74/Math.max(1,frames.length-1),20-n(v.score)*16/max];
  tip.querySelector('polyline').setAttribute('points',frames.slice(0,idx+1).map((v,i)=>point(v,i).join(',')).join(' '));
  const [x,y]=point(f,idx);const dot=tip.querySelector('circle');dot.setAttribute('cx',x);dot.setAttribute('cy',y);
  const event=events.reduce((last,ev)=>n(ev.elapsed)<=n(f.elapsed)&&(!last||n(ev.elapsed)>=n(last.elapsed))?ev:last,null);
  const kind={dock:'入港',depart:'出港',miss:'失注',supply:'補給'};
  tip.querySelector('span').textContent=n(f.elapsed).toFixed(0)+'秒 '+(event?kind[event.kind]||'':'待機')+' '+num(f.served)+'隻';
  input.setAttribute('aria-valuetext',n(f.elapsed).toFixed(0)+'秒、出港'+num(f.served)+'隻、得点'+num(f.score)+(event?.name?'、直前: '+event.name:''));
 }
 function renderRecord(){
  const list=runList();
  page=Math.min(page,Math.max(0,list.length-1));
  const r=list[page];
  if(!r){content.innerHTML='<div class="sr-card"><div class="sr-cardhead">まだ記録はありません</div><p class="sr-display">管制を始めると、ここにシフトの記録が残ります。</p></div>';return;}
  const current=r===state, key=recordId(r), isNew=!current&&!ledgerSeen.has(key);
  const old=content.querySelector('.sr-leaf');if(old)old.remove();
  content.innerHTML='<div class="sr-ledger"><article class="sr-card"><div class="sr-cardhead"><span>'+(current?'今のシフト':r.clear?'完了':'途中終了')+'</span>'+(isNew?'<span class="sr-new">NEW</span>':'')+'</div><div class="sr-display sr-flex"><strong>'+num(r.score)+' 点</strong><span>出港 '+num(r.served)+'</span><span>失注 '+num(r.missed)+'</span></div>'+
   (r.frames&&r.frames.length>1?'<div class="sr-replay"><div class="sr-tip" aria-hidden="true"><svg viewBox="0 0 80 23"><path d="M3 20H77M3 3V20" stroke="#48658f" stroke-width="1"/><polyline fill="none" stroke="#85f7d1" stroke-width="2"/><circle r="2.4" fill="#ffdb8a"/></svg><span></span></div><input type="range" min="0" max="'+(r.frames.length-1)+'" value="'+(r.frames.length-1)+'" aria-label="シフト記録の時間軸"></div>':'<p class="sr-display">'+num(r.sec)+'秒 ・ 出港 '+num(r.served)+'隻'+'</p>')+
   '</article></div><div class="sr-pagebuttons"><button type="button" data-sr="prev" aria-label="前のシフト" '+(page<=0?'disabled':'')+'>‹</button><span>'+(page+1)+' / '+list.length+'</span><button type="button" data-sr="next" aria-label="次のシフト" '+(page+1>=list.length?'disabled':'')+'>›</button></div>';
  if(isNew){
   const badge=content.querySelector('.sr-new');
   setTimeout(()=>{
    if(view.hidden||tab!=='record'||!content.contains(badge))return;
    ledgerSeen.add(key);badge.classList.add('sr-read');
    if(reduced.matches)badge.remove();else badge.addEventListener('animationend',()=>badge.remove(),{once:true});
   },480);
  }
  const range=content.querySelector('input');
  if(range){const tip=content.querySelector('.sr-tip');const move=()=>frameTip(range,r.frames,r.events||[],tip);range.addEventListener('input',move);move();}
 }
 function change(to){
  if(tab===to&&currentRoute<0)return;
  if(handle)clearTimeout(handle);
  const render=()=>{handle=0;tab=to;currentRoute=-1;tabStyle();content.className='sr-content sr-in';to==='route'?renderRoute():renderRecord();};
  if(reduced.matches){render();return;}
  content.className='sr-content sr-out';handle=setTimeout(render,120);
 }
 function pageTurn(inc){
  const list=runList(), target=page+inc;
  if(!list[target])return;
  const old=content.querySelector('.sr-cardhead span')?.textContent||'';
  page=target;renderRecord();
  if(!reduced.matches){
   const leaf=document.createElement('div');leaf.className='sr-leaf';leaf.setAttribute('aria-hidden','true');
   leaf.innerHTML='<div></div><div>✦</div>';leaf.firstElementChild.textContent=old;
   if(inc<0){leaf.style.animationName='none';leaf.animate([{transform:'rotateY(0)'},{transform:'rotateY(175deg)',opacity:0}],{duration:440,easing:'ease-in-out'}).finished.then(()=>leaf.remove(),()=>{});}
   else leaf.addEventListener('animationend',()=>leaf.remove(),{once:true});
   content.querySelector('.sr-ledger').appendChild(leaf);
  }
  const currentButton=content.querySelector('[data-sr="'+(inc<0?'prev':'next')+'"]:not(:disabled)')||content.querySelector('.sr-pagebuttons button:not(:disabled)');
  currentButton?.focus({preventScroll:true});
 }
 function close(){
  if(view.hidden)return;
  if(handle)clearTimeout(handle);handle=0;view.hidden=true;content.replaceChildren();
  const cb=closeFn;closeFn=null;if(cb)cb();
  if(origin&&origin.isConnected&&origin.getClientRects().length)origin.focus({preventScroll:true});
 }
 view.addEventListener('click',e=>{
  const b=e.target.closest('[data-sr]');if(!b||b.disabled)return;
  const action=b.dataset.sr;
  if(action==='exit')close();
  else if(action==='route'||action==='record')change(action);
  else if(action==='detail')renderDetail(Number(b.dataset.i),b.getBoundingClientRect());
  else if(action==='back'){const i=currentRoute;currentRoute=-1;renderRoute();content.querySelector('[data-i="'+i+'"]')?.focus({preventScroll:true});}
  else if(action==='note'){
    const note=content.querySelector('.sr-note');note.hidden=!note.hidden;b.setAttribute('aria-expanded',String(!note.hidden));b.textContent='管制メモ '+(note.hidden?'＋':'−');
  }
  else if(action==='prev'||action==='next')pageTurn(action==='prev'?-1:1);
 });
 view.addEventListener('keydown',e=>{
  if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();close();return;}
  if(e.key!=='Tab')return;
  const items=[...view.querySelectorAll('button:not(:disabled),input')].filter(el=>el.getClientRects().length);
  const first=items[0],last=items[items.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
 });
 window.portReports={open(data,callback){
  state=data||{};closeFn=callback;origin=document.activeElement;tab='route';page=0;currentRoute=-1;
  view.hidden=false;tabStyle();content.className='sr-content';renderRoute();
  view.querySelector('[data-sr=exit]').focus({preventScroll:true});
 },close,closed:()=>view.hidden};
})();
</script>

</body></html>
