<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>採掘ゲーム UI比較</title><style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:#0d1421;color:#edf0f6;font-family:system-ui,sans-serif}
main{max-width:1210px;margin:auto;padding:clamp(12px,3vw,30px)}header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:13px}
h1{font-size:clamp(17px,3vw,25px);margin:0}.tools{display:flex;gap:4px;flex-wrap:wrap}
.tools button{background:#182438;color:#c1ccdc;border:1px solid #43536e;border-radius:5px;font-size:12px;min-height:36px;padding:0 10px;cursor:pointer}
.tools button[aria-pressed=true]{background:#2b4263;color:white}.tools button:last-child{margin-left:5px}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.pane{min-width:0}.pane h2{font-size:13px;letter-spacing:.05em;margin:0 0 7px;color:#c5cfdf}
.board{position:relative;isolation:isolate;overflow:hidden;aspect-ratio:6/5;width:100%;background:#111b2d;border:1px solid #4b607b;border-radius:8px}
.board .mine-scene,.variant-a .mine-scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;pointer-events:none}
button{font-family:inherit;cursor:pointer}.board button:focus-visible{outline:2px solid #fff;outline-offset:2px}.board button:disabled{opacity:.55;cursor:not-allowed}
[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.compare[data-view=a],.compare[data-view=b]{grid-template-columns:minmax(0,590px);justify-content:center}
.compare[data-view=a] .pane-b,.compare[data-view=b] .pane-a{display:none}
.tip{font-size:12px;color:#a5b7cb;margin-top:13px;line-height:1.5}
@media(max-width:760px){.compare{grid-template-columns:minmax(0,590px);justify-content:center}}
.variant-a {
  position:relative;
  overflow:hidden;
  isolation:isolate;
  aspect-ratio:6/5;
  background:#0c1423;
  color:#f4f7ff;
  font-family:system-ui,sans-serif;
}
.variant-a .mine-scene { position:absolute; inset:0; z-index:-2; width:100%; height:100%; object-fit:cover; }
.variant-a .a-hud, .variant-a .a-console { position:absolute; left:3.4%; right:3.4%; }
.variant-a .a-hud { top:3.4%; }
.variant-a .a-title, .variant-a .a-status { display:flex; align-items:center; gap:8px; }
.variant-a .a-title { font-size:10px; font-weight:750; letter-spacing:.14em; text-shadow:0 2px 3px #000; margin:0 0 7px 2px; }
.variant-a .a-lamp { background:#7eccaa; width:6px; height:6px; border-radius:50%; flex:none; box-shadow:0 0 7px #7eccaa77; }
.variant-a .a-stats, .variant-a .a-console, .variant-a .a-inventory { background:#101b2bef; border:1px solid #54647c; border-radius:8px; box-shadow:0 5px 18px #03061066; }
.variant-a .a-stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); padding:7px 0; }
.variant-a .a-stats > div { padding:0 clamp(7px,2vw,13px); }
.variant-a .a-stats > div + div { border-left:1px solid #3b4961; }
.variant-a .a-stats small { display:block; font-size:9px; font-weight:700; letter-spacing:.055em; color:#b5c0d5; }
.variant-a .a-stats strong { display:block; margin-top:1px; font-size:clamp(14px,3.4vw,19px); font-variant-numeric:tabular-nums; white-space:nowrap; }
.variant-a .a-console { bottom:3.4%; padding:8px; }
.variant-a .a-status { min-height:19px; padding:0 3px 6px; color:#d2dbea; font-size:11px; line-height:1.25; }
.variant-a .a-status .a-lamp { width:5px; height:5px; }
.variant-a .a-actions { display:grid; grid-template-columns:1.12fr 1fr 1fr; gap:6px; }
.variant-a button { padding:4px 6px; min-height:38px; color:#f0f4fd; border:1px solid #63738b; background:linear-gradient(#33445c,#243249); border-radius:5px; font:inherit; font-size:12px; line-height:1.08; font-weight:700; cursor:pointer; }
.variant-a button:hover { filter:brightness(1.18); }
.variant-a button:active { transform:translateY(1px); }
.variant-a button:focus-visible { outline:2px solid #fff; outline-offset:2px; }
.variant-a button.a-mine { background:linear-gradient(#ffd486,#f4a640); border-color:#ffd38d; color:#312009; font-size:14px; }
.variant-a .a-actions button small { display:block; margin-top:2px; color:#d1daea; font-weight:500; font-size:10px; }
.variant-a .a-inventory { position:absolute; z-index:3; inset:26% 12% auto; padding:12px; }
.variant-a .a-inventory[hidden] { display:none; }
.variant-a .a-bag-head, .variant-a .a-bag-row { display:flex; align-items:center; justify-content:space-between; }
.variant-a .a-bag-row { border-top:1px solid #3b4961; padding:12px 0 0; margin-top:10px; font-size:14px; }

.variant-b{color:#e8ebf2;--line:#56708b;--amber:#f7c078;--soft:#abbaCD}
.variant-b .depth-tag{position:absolute;left:4%;top:5%;font-size:clamp(17px,3vw,30px);font-weight:800;color:#f5eadb;letter-spacing:.045em;text-shadow:0 2px #101729;line-height:1.2}
.variant-b .depth-tag .m{font-size:.55em;color:#c9c5c4}
.variant-b .resources{position:absolute;display:flex;gap:7px;align-items:flex-start;right:4%;top:5%;font-size:14px;font-weight:700}
.variant-b .resources>div{background:#101a2aeb;border:1px solid #45607a;padding:5px 7px;display:flex;min-height:33px;align-items:center;gap:3px;position:relative}
.variant-b .fuel svg,.variant-b .ore svg{width:14px;height:14px;display:block}
.variant-b .fuel svg{color:#72c9d4}.variant-b .capacity{font-size:11px;color:#b3c6d4}
.variant-b .fuel-track{position:absolute;height:2px;left:6px;right:6px;bottom:3px;background:#344a5c;display:block}
.variant-b .fuel-track i{height:100%;width:72%;background:#78dde1;display:block}
.variant-b .vehicle-state{position:absolute;bottom:23%;left:50%;transform:translateX(-50%);white-space:nowrap;padding:3px 8px;border:1px solid #54708b;background:#152337e8;color:#bac9db;font-size:12px;letter-spacing:.04em}
.variant-b .vehicle-state b{color:#f4c180}
.variant-b .dock{position:absolute;left:4%;right:4%;bottom:5%;display:flex;gap:7px;align-items:stretch}
.variant-b .dock button{min-height:44px;background:#1b2a42;color:#f5ebdc;border:1px solid #56708b;box-shadow:0 3px #101827;font-weight:800}
.variant-b .dock .bag-button{width:48px;display:grid;place-items:center}
.variant-b .bag-button svg{width:23px;height:23px}
.variant-b .dock .mine-button{flex:1;background:#f4b36d;color:#302031;border:2px solid #ffe0a2;box-shadow:inset 0 -5px #d48554,0 3px #101827;font-size:18px}
.variant-b .dock .upgrade-button{padding:0 10px;background:#24243c;color:#e9d9f3;white-space:nowrap;font-size:13px}
.variant-b .upgrade-button>span{color:#d0a7ed;display:inline-block;font-size:12px;margin-left:3px}
.variant-b .upgrade-button[data-affordable=true]{border-color:#d1a7ec}
.variant-b .field-feedback{position:absolute;bottom:16.5%;right:4%;max-width:55%;margin:0;background:#171d31eb;color:#f5d0ad;font-size:12px;font-weight:750;line-height:1.3;padding:4px 7px;border-left:2px solid #f2ae78;pointer-events:none}
.variant-b .field-feedback:empty{display:none}
.variant-b [data-inert=true]{pointer-events:none}
.variant-b .bag-layer{position:absolute;inset:0;display:grid;place-items:center;z-index:3}
.variant-b .bag-shade{position:absolute;inset:0;background:#0c1424bc;pointer-events:none}
.variant-b .bag-dialog{position:relative}
.variant-b .fuel-track{position:relative;display:grid;inset:auto;grid-column:1/-1;align-self:stretch;background:#344a5c;min-width:64px;margin:0}
.variant-b .fuel{display:grid!important;grid-template-columns:14px auto auto;grid-template-rows:auto 3px;column-gap:4px!important;row-gap:3px!important}
.variant-b .fuel-track i{grid-area:1/1;display:block;height:100%}
.variant-b .fuel-track .fuel-trail{background:#ffb65a;transition:width 220ms 90ms ease-out}
.variant-b .fuel-track [data-bind=fuel-bar]{z-index:1}
.variant-b .ore-flight{position:absolute;left:0;top:0;width:15px;height:15px;border:2px solid #f4d5ff;background:linear-gradient(135deg,#e9c1ff,#8e5ac7);border-radius:2px;pointer-events:none;z-index:2;box-shadow:0 0 9px #cb86f7}
.variant-b[data-feedback=upgrade] .vehicle-state b{display:inline-block;animation:drill-pop 280ms ease-out}
@keyframes drill-pop{0%{transform:scale(.91)}52%{transform:scale(1.23);color:#fff8c8}100%{transform:scale(1)}}
.variant-b .bag-dialog{width:min(310px,84%);background:#18293f;border:2px solid #7898ae;padding:12px 14px;box-shadow:0 8px 0 #0b1321}
.variant-b .bag-top{display:flex;justify-content:space-between;align-items:center;color:#fff0d5;margin-bottom:6px}
.variant-b .bag-top button{height:36px;width:40px;border:1px solid #526d89;background:#243953;color:#f5e4ce;font-size:22px}
.variant-b .bag-row{display:flex;justify-content:space-between;align-items:center;min-height:42px;border-top:1px solid #334d64;color:#dae5e8;font-size:14px}
.variant-b .bag-row b{color:#f2cd9e}.variant-b .bag-row span[aria-hidden]{color:#cda6eb}
.variant-b .mine-button:active{transform:translateY(2px) scale(.985)}
.variant-b[data-feedback=denied] .upgrade-button>span{animation:tap-refuse .18s ease-in-out}
.variant-b[data-feedback=mine] .ore,.variant-b[data-feedback=upgrade] .vehicle-state{animation:tap-gain .2s ease-out}
@keyframes tap-refuse{25%,75%{transform:translateX(2px)}50%{transform:translateX(-3px)}}
@keyframes tap-gain{45%{filter:brightness(1.65)}}

.variant-a .a-stats small{font-size:11px;letter-spacing:0}.variant-a .a-actions button{min-height:44px}
@media(prefers-reduced-motion:reduce){.board *{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><main><header><h1>採掘ゲーム UI比較</h1><div class="tools" aria-label="比較表示"><button data-view="both" aria-pressed="true">両方</button><button data-view="a" aria-pressed="false">A</button><button data-view="b" aria-pressed="false">B</button><button id="reset">リセット</button></div></header>

 <div class="bag-dialog" role="dialog" aria-modal="true" aria-label="持ち物">
  <div class="bag-top"><strong>持ち物</strong><button type="button" data-action="bag" aria-label="閉じる">×</button></div>
  <div class="bag-row"><span><span aria-hidden="true">◆ </span>鉱石</span><b data-bind="ore">32</b></div>
  <div class="bag-row"><span>ドリル</span><b>Lv.<span data-bind="level">1</span></b></div>
 </div>
</div>
</section></article>
</div><p class="tip">持ち物を開いて閉じる → 強化を押す → 掘る×2 → もう一度強化。左右の進行は別々です。</p></main><script>(() => {
const start=()=>({ore:32,fuel:72,depth:148,level:1,message:'',bag:false,tag:''});
const boards=[...document.querySelectorAll('.board')];
const games=boards.map(board=>({board,state:start(),timer:0,trigger:null,closing:false,sequence:0,animations:[],flights:[]}));
const reduce=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const skill=g=>g.board.classList.contains('variant-b');
const cost=s=>40+20*(s.level-1);
function render(g){
 const {board,state:s}=g;
 const vals={...s,cost:cost(s),message:s.message || (board.classList.contains('variant-a')?'採掘できます':'')};
 for(const n of board.querySelectorAll('[data-bind]')){
   const k=n.dataset.bind;
   if(k==='fuel-bar'||k==='fuel-trail')n.style.width=s.fuel+'%';
   else n.textContent=vals[k];
 }
 const bag=board.querySelector('[data-panel=bag]');
 bag.hidden=!s.bag&&!g.closing;
 for(const b of board.querySelectorAll('button[data-action]')){
   if(!bag.contains(b)){
     b.inert=s.bag||g.closing;
     if(b.dataset.action==='bag')b.setAttribute('aria-expanded',String(s.bag));
   }
   if(b.dataset.action==='mine')b.disabled=s.fuel<5;
   if(b.dataset.action==='upgrade')b.dataset.affordable=String(s.ore>=cost(s));
 }
}
function signal(g,tag){
 clearTimeout(g.timer);
 g.board.removeAttribute('data-feedback');
 requestAnimationFrame(()=>{if(g.state.tag===tag)g.board.dataset.feedback=tag});
 g.state.tag=tag;
 g.timer=setTimeout(()=>{g.state.message='';g.state.tag='';g.board.removeAttribute('data-feedback');render(g)},tag==='denied'?2300:1600);
}
function clearMotion(g){
 g.sequence++;g.closing=false;
 for(const a of g.animations)a.cancel();g.animations=[];
 for(const p of g.flights)p.remove();g.flights=[];
}
function toggleBag(g,button){
 if(g.closing)return;
 const bag=g.board.querySelector('[data-panel=bag]');
 const dialog=bag.querySelector('.bag-dialog'),shade=bag.querySelector('.bag-shade');
 const opening=!g.state.bag,motion=skill(g)&&!reduce()&&dialog&&shade&&typeof dialog.animate==='function';
 // Sample the displayed frame before interrupting an opening animation.
 const fromPanel=motion&&!opening?getComputedStyle(dialog).transform:'translateY(16px) scale(.97)';
 const fromPanelOpacity=motion&&!opening?getComputedStyle(dialog).opacity:'0';
 const fromShade=motion&&!opening?getComputedStyle(shade).opacity:'0';
 const sequence=++g.sequence;
 for(const a of g.animations)a.cancel();g.animations=[];
 g.state.bag=opening;g.closing=!opening&&!!motion;if(opening)g.trigger=button;
 render(g);
 if(opening)bag.querySelector('button').focus();
 else if(!motion&&g.trigger)g.trigger.focus();
 if(!motion)return;
 const time=opening?195:125, easing=opening?'cubic-bezier(.2,.75,.27,1)':'ease-in';
 const backdrop=shade.animate([{opacity:fromShade},{opacity:opening?1:0}],{duration:time,easing,fill:'both'});
 const panel=dialog.animate([{opacity:fromPanelOpacity,transform:fromPanel},{opacity:opening?1:0,transform:opening?'none':'translateY(9px) scale(.985)'}],{duration:time,easing,fill:'both'});
 g.animations=[backdrop,panel];
 Promise.all(g.animations.map(a=>a.finished)).then(()=>{
   if(sequence!==g.sequence)return;
   g.closing=false;render(g);
   for(const a of g.animations)a.cancel();g.animations=[];
   if(!opening&&g.trigger)g.trigger.focus();
 }).catch(()=>{});
}
function flyOre(g){
 if(!skill(g)||reduce()||typeof Element.prototype.animate!=='function'||g.flights.length>=6)return;
 const a=g.board.getBoundingClientRect(),o=g.board.querySelector('.ore').getBoundingClientRect();
 const x=a.width*.64,y=a.height*.64,tx=o.left-a.left+12,ty=o.top-a.top+14;
 const shard=document.createElement('span');shard.className='ore-flight';shard.setAttribute('aria-hidden','true');
 g.board.append(shard);g.flights.push(shard);
 const tr=(x,y,k)=>'translate('+x+'px,'+y+'px) rotate(45deg) scale('+k+')';
 const flight=shard.animate([{transform:tr(x,y,1),opacity:1},{transform:tr((x+tx)/2,ty+(y-ty)*.16,1.05),opacity:1,offset:.55},{transform:tr(tx,ty,.35),opacity:.25}],{duration:365,easing:'cubic-bezier(.28,.55,.4,1)',fill:'both'});
 const done=()=>{shard.remove();g.flights=g.flights.filter(p=>p!==shard)};
 flight.finished.then(done,done);
}
for(const g of games){
 g.board.addEventListener('click',e=>{
   const button=e.target.closest('button[data-action]');
   if(!button||button.disabled||button.inert)return;
   const a=button.dataset.action,s=g.state;
   if(a==='bag'){toggleBag(g,button);return}
   if(a==='mine'){s.ore+=6;s.depth+=4;s.fuel-=5;flyOre(g);s.message=s.fuel<5?'燃料が足りません':'鉱石 ＋6';signal(g,'mine')}
   if(a==='upgrade'){
     const price=cost(s);
     if(s.ore<price){s.message='鉱石があと'+(price-s.ore)+'必要';signal(g,'denied')}
     else {s.ore-=price;s.level++;s.message='ドリル Lv.'+s.level;signal(g,'upgrade')}
   }
   render(g);
 });
 g.board.addEventListener('keydown',e=>{
  if(!g.state.bag&&!g.closing)return;
  if(e.key==='Escape'){e.preventDefault();toggleBag(g);}
  if(e.key==='Tab'){e.preventDefault();g.board.querySelector('[data-panel=bag] button').focus();}
 });
 render(g);
}
document.getElementById('reset').addEventListener('click',()=>{
  for(const g of games){clearTimeout(g.timer);clearMotion(g);g.state=start();g.board.removeAttribute('data-feedback');render(g)}
});
document.querySelectorAll('[data-view]').forEach(btn=>btn.addEventListener('click',()=>{
  const v=btn.dataset.view;
  document.querySelector('.compare').dataset.view=v;
  for(const b of document.querySelectorAll('[data-view][aria-pressed]'))b.setAttribute('aria-pressed',String(b===btn));
}));
})();
</script></body></html>
