<body><main>
<header><div><p class="eyebrow">GAME UI BASICS / PLAYABLE STUDY</p><h1>採掘ゲームのUI比較</h1><p class="intro">どちらで操作しても、同じ採掘状態が両方に反映されます。</p></div><div class="controls" aria-label="表示する画面"><button data-view="both" aria-pressed="true">両方</button><button data-view="a" aria-pressed="false">Aのみ</button><button data-view="b" aria-pressed="false">Bのみ</button></div></header>
<div class="scenarios" aria-label="比較する場面"><span>場面</span><button data-case="start" aria-pressed="true">初期状態</button><button data-case="low" aria-pressed="false">燃料不足</button><button data-case="upgrade" aria-pressed="false">強化直前</button><button data-case="placement" aria-pressed="false">ビーコン配置</button></div>
<section class="compare" data-view="both" aria-label="2つのゲーム画面"></section>
<p class="note">同じルールで操作の伝え方を比べる作例です。モデルの性能比較ではありません。<br><a href="https://github.com/csoda/game_ui_basics/blob/main/references/ai-ui.md">設計の考え方</a> · <a href="https://csoda.github.io/game_ui_basics/samples.html">UI動作集</a> · <a href="https://csoda.github.io/game_ui_basics/punipo/">ぷにぽ防衛隊の作例</a></p>
</main>
<script>
"use strict";
const initial = () => ({ore:32,fuel:72,depth:148,level:1,bag:false,placement:false,cell:1,installed:null,gain:0,event:"",message:"採掘できます。"});
const isBlocked = cell => cell === 1 || cell === 5;
const cost = s => 40 + 20*(s.level-1);
const cellName = cell => String.fromCharCode(65+cell);
function reduce(prev, action, value) {
  if (action === "scenario") {
    const next=initial();
    if(value==="low") Object.assign(next,{fuel:12,message:"燃料が足りません。補給してください。",event:"empty"});
    if(value==="upgrade") Object.assign(next,{ore:38,message:"強化には鉱石があと2個必要です。",event:"cost"});
    if(value==="placement") Object.assign(next,{placement:true,message:"設置場所を選んでください。"});
    return next;
  }
  const s={...prev,event:"",gain:0};
  const msg=(event,message)=>Object.assign(s,{event,message});
  if(action==="mine") {
    if(s.fuel<24) return msg("empty","採掘には燃料が24必要です。補給してください。");
    s.gain=3+2*(s.level-1);s.ore+=s.gain;s.fuel-=24;s.depth+=6;
    return msg("mine",`鉱石 +${s.gain}、深度 +6 m。`);
  }
  if(action==="refill") { const amount=100-s.fuel;s.fuel=100;return msg("refill",amount?`燃料 +${amount}。`:"燃料は満タンです。"); }
  if(action==="upgrade") {
    const price=cost(s);if(s.ore<price) return msg("cost",`強化には鉱石があと${price-s.ore}個必要です。`);
    s.ore-=price;s.level++;return msg("upgrade",`ドリルを Lv.${s.level} に強化しました。`);
  }
  if(action==="bag"){s.bag=!s.bag;return s;}
  if(action==="placement"){s.placement=!s.placement;return msg("",s.placement?"設置場所を選んでください。":"配置を閉じました。");}
  if(action==="cell"){s.cell=Number(value);return msg("cell",isBlocked(s.cell)?`${cellName(s.cell)}には岩があります。`:`${cellName(s.cell)}を選択しました。`);}
  if(action==="install"){
    if(isBlocked(s.cell)) return msg("blocked",`${cellName(s.cell)}には岩があります。別の場所を選んでください。`);
    if(s.installed===s.cell) return msg("installed",`${cellName(s.cell)}に設置済みです。`);
    s.installed=s.cell;return msg("installed",`ビーコンを${cellName(s.cell)}に設置しました。`);
  }
  return s;
}

const compare=document.querySelector(".compare");
const stat=(klass,label,bind,extra="")=>`<div class="${klass}"><small>${label}</small><strong data-bind="${bind}"></strong>${extra}</div>`;
function pane(v){
  const b=v==="b",title=b?"視覚で伝える":"文字で伝える";
  return `<article class="pane pane-${v}"><h2><b>${v.toUpperCase()}</b>${title}</h2>
  <section class="board board-${v}" role="region" aria-label="${title}ゲーム画面">
  <div class="play">
  <div class="hud">
  ${stat("ore resource","鉱石","ore",b?'<span class="gain" aria-hidden="true" data-bind="gain"></span>':"")}
  ${stat("fuel","燃料","fuel",b?'<span class="meter" aria-hidden="true"><i></i></span><span class="low" data-bind="low" hidden>⛽ 要補給</span>':"")}
  ${stat("","深度","depth")}
  ${b?"":stat("","ドリル","level")}
  </div>
  ${b?'<div class="tactical"><span>ドリル</span><b data-bind="level"></b></div>':""}
  <span class="world-beacon" hidden data-world-beacon></span>
  <div class="grid-caption" hidden data-place>ビーコン</div>
  <div class="grid" data-place hidden role="group" aria-label="設置場所">${Array.from({length:6},(_,i)=>`<button data-action="cell" data-cell="${i}" aria-pressed="false"><span>${cellName(i)}</span></button>`).join("")}</div>
  <div class="placement" data-place hidden><button data-action="install">ここに設置</button><button data-action="placement">閉じる</button></div>
  <p class="status" role="status" aria-atomic="true"></p>
  ${b?'<div class="cue cue-mine" aria-hidden="true"></div><div class="cue cue-refill" aria-hidden="true"></div><div class="cue cue-upgrade" aria-hidden="true"></div><div class="cue cue-place" aria-hidden="true"></div>':""}
  <div class="dock">
  <button class="mine" data-action="mine">採掘</button><button class="refill" data-action="refill">補給</button>
  <button data-action="bag" aria-haspopup="dialog">所持品</button><button class="upgrade" data-action="upgrade">強化<small data-bind="cost"></small></button>
  <button data-action="placement" aria-expanded="false">配置</button>
  </div>
  </div>
  <div class="bag" data-bag hidden role="dialog" aria-modal="false" aria-label="所持品">
  <div class="bag-inner"><div class="bag-top"><b>所持品</b><button data-action="bag">閉じる</button></div>
  <div class="bag-row"><span>鉱石</span><b data-bind="ore"></b></div><div class="bag-row"><span>ドリル</span><b data-bind="level"></b></div>
  <div class="bag-row"><span>ビーコン</span><b data-bind="beacon"></b></div>
  </div></div>
  </section></article>`;
}
compare.innerHTML=pane("a")+pane("b");
let state=initial(),activeBoard=compare.querySelector(".board-a"),bagFrom=null,placeFrom=null;
const boardB=compare.querySelector(".board-b");
const set=(root,key,val)=>root.querySelectorAll(`[data-bind="${key}"]`).forEach(el=>el.textContent=val);
function render({announce=false}={}){
  const s=state;
  for (const board of compare.querySelectorAll(".board")){
    const variant=board===boardB;
    for(const [key,val] of Object.entries({ore:s.ore,fuel:`${s.fuel}/100`,depth:`${s.depth} m`,level:`Lv.${s.level}`,cost:`鉱石 ${cost(s)}`,beacon:s.installed===null?"未設置":`${cellName(s.installed)}に設置済み`,gain:s.gain?`+${s.gain}`:""})) set(board,key,val);
    const status=board.querySelector(".status");
    const isActive=board===activeBoard;status.setAttribute("aria-live",isActive?"polite":"off");
    if(status.textContent!==s.message||announce) status.textContent=s.message;
    board.querySelectorAll("[data-place]").forEach(el=>el.hidden=!s.placement);
    board.dataset.placement=String(s.placement);
    const beacon=board.querySelector("[data-world-beacon]");
    beacon.hidden=s.installed===null||s.placement;
    beacon.textContent=s.installed===null?"":`♜ ${cellName(s.installed)}`;
    if(s.installed!==null){beacon.style.right=(8+12*(2-s.installed%3))+"%";beacon.style.top=(43+13*Math.floor(s.installed/3))+"%";}
    board.querySelector(".dock [data-action=placement]").setAttribute("aria-expanded",s.placement);
    board.querySelector("[data-bag]").hidden=!s.bag;
    board.querySelector(".play").inert=s.bag;
    for(const cell of board.querySelectorAll("[data-cell]")){
      const i=Number(cell.dataset.cell),blocked=isBlocked(i),installed=s.installed===i;
      cell.dataset.blocked=String(blocked);cell.dataset.installed=String(installed);
      cell.setAttribute("aria-pressed",String(i===s.cell));
      cell.setAttribute("aria-label",`${cellName(i)}、${installed?"ビーコン設置済み":blocked?"岩":"空き"}`);
      cell.querySelector("span").textContent=variant&&blocked?"× "+cellName(i):installed?"✓ "+cellName(i):cellName(i);
    }
    if(!variant) continue;
    board.querySelector(".meter i").style.width=s.fuel+"%";
    board.querySelector(".fuel").dataset.low=String(s.fuel<24);
    board.querySelector(".low").hidden=s.fuel>=24;
    board.querySelector(".refill").dataset.needed=String(s.fuel<24);
    const upgrade=board.querySelector(".upgrade");
    upgrade.dataset.ready=String(s.ore>=cost(s));
    upgrade.removeAttribute("data-refused");
    if(announce&&s.event==="cost"){void upgrade.offsetWidth;upgrade.setAttribute("data-refused","");}
    board.querySelector(".cue-upgrade").textContent=s.event==="cost"?`鉱石があと${cost(s)-s.ore}個`:s.event==="upgrade"?`✓ ドリル Lv.${s.level}`:"";
    board.querySelector(".cue-refill").textContent=s.event==="refill"?"✓ 燃料満タン":s.event==="empty"?"採掘には燃料24が必要":"";
    board.querySelector(".cue-place").textContent=s.placement?(s.event==="blocked"?"岩がある":s.event==="installed"?"✓ 設置済み":""):"";
    board.querySelector(".cue-mine").textContent=s.event==="mine"?`深度 +6 m`:"";
  }
}
function animate(){
  if(state.event!=="mine"||matchMedia("(prefers-reduced-motion: reduce)").matches||boardB.getClientRects().length===0) return;
  while(boardB.querySelectorAll(".particle").length>4) boardB.querySelector(".particle").remove();
  const particle=document.createElement("i");particle.className="particle";particle.setAttribute("aria-hidden","true");
  boardB.append(particle);setTimeout(()=>particle.remove(),550);
}
document.addEventListener("click",e=>{
  const btn=e.target.closest("button");if(!btn)return;
  if(btn.dataset.view){compare.dataset.view=btn.dataset.view;
    document.querySelectorAll("button[data-view]").forEach(b=>b.setAttribute("aria-pressed",b===btn));
    activeBoard=compare.querySelector(btn.dataset.view==="b"?".board-b":".board-a");
    if(state.bag){bagFrom=null;render();activeBoard.querySelector("[data-bag] button").focus();}
    return;
  }
  if(btn.dataset.case){state=reduce(state,"scenario",btn.dataset.case);document.querySelectorAll("button[data-case]").forEach(b=>b.setAttribute("aria-pressed",b===btn));render();return;}
  const a=btn.dataset.action;if(!a)return;
  activeBoard=btn.closest(".board");
  const oldState=state;state=reduce(state,a,btn.dataset.cell);
  if(a==="bag"&&state.bag)bagFrom=btn;
  if(a==="placement"&&state.placement)placeFrom=btn;
  render({announce:true});animate();
  if(a==="bag"&&state.bag)activeBoard.querySelector("[data-bag] button").focus();
  if(a==="bag"&&!state.bag)(bagFrom?.getClientRects().length?bagFrom:activeBoard.querySelector(".dock [data-action=bag]")).focus();
  if(a==="placement"&&state.placement)activeBoard.querySelector(`[data-cell="${state.cell}"]`).focus();
  if(a==="placement"&&!state.placement&&oldState.placement)(placeFrom?.getClientRects().length?placeFrom:activeBoard.querySelector(".dock [data-action=placement]")).focus();
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;const board=e.target.closest(".board")||activeBoard;
  if(state.bag){e.preventDefault();board.querySelector("[data-bag] button").click();}
  else if(state.placement&&e.target.closest(".board")){e.preventDefault();board.querySelector(".placement [data-action=placement]").click();}
});
render();
</script></body></html>
